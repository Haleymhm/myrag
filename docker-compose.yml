services:
  db:
    image: pgvector/pgvector:pg17
    container_name: extracto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: extracto
    ports:
      - "5432:5432"
    volumes:
      - extracto_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d extracto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  extracto_pgdata:
